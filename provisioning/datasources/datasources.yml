apiVersion: 1

deleteDatasources:
  - name: Google Sheets Service Account
    orgId: 1

datasources:
  - name: Google Sheets Service Account
    type: grafana-googlesheets-datasource
    uid: google-sheets-service-account
    editable: true
    version: 1
    jsonData:
      authenticationType: 'jwt'
      defaultProject: 'jazz-e2320'
      clientEmail: 'sheetstest@jazz-e2320.iam.gserviceaccount.com'
      # only used when GS_JWT is empty: e2e replay points it at a generated throwaway key
      privateKeyPath: $GS_PRIVATE_KEY_PATH
      tokenUri: 'https://oauth2.googleapis.com/token'
    secureJsonData:
      # the whole service account JSON on one line (jq -c); takes priority over the fields above
      jwt: '$GS_JWT'
